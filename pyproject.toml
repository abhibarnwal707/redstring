[project]
name = "redstring-cti"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek Kumar", email = "abhibarnwal707@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4,<4",
    "gradio>=6.30.0",
    "httpx>=0.28.1",
    "ijson>=3.6.0",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "lm-format-enforcer>=0.11.3",
    "lxml>=6.1.3",
    "mlflow>=3.17.2",
    "neo4j>=6.4.1",
    "orjson>=3.13.0",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "ragas>=0.4.3",
    "sentence-transformers>=6.1.0",
    "tqdm>=4.70.1",
]

[project.scripts]
redstring-cti = "redstring_cti:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]  # never collect third-party repos cloned under data/
norecursedirs = ["data", ".venv", "mlruns", "finetune"]

[[tool.mypy.overrides]]
module = ["ijson", "lmformatenforcer", "lmformatenforcer.*"]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["finetune/notebooks"]  # Kaggle script: unsloth/trl exist only there
